services:
  panel:
    image: vbif666/noisefloor-amneziawg-panel:latest
    container_name: NOISEFLOOR-amneziawg-panel
    restart: unless-stopped
    # Без лимита json-лог растёт бесконечно: панель пишет строку на каждый
    # запрос дашборда, а дашборд опрашивает сервер каждые несколько секунд.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    env_file:
      - .env
    volumes:
      - ./data:/opt/panel/data
      - ./awg_config:/etc/amnezia/amneziawg
