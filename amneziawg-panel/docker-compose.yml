services:
  panel:
    image: vbif666/noisefloor-amneziawg-panel:latest
    container_name: NOISEFLOOR-amneziawg-panel
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    env_file:
      - .env
    volumes:
      - ./data:/opt/panel/data
      - ./awg_config:/etc/amnezia/amneziawg
