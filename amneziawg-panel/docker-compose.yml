services:
  panel:
    image: vbif666/noisefloor-amneziawg-panel:latest
    container_name: NOISEFLOOR-amneziawg-panel
    restart: unless-stopped
    # На маленьком сервере под нехваткой памяти ядро должно выбирать не панель:
    # с ней уходят туннель и все клиенты.
    oom_score_adj: -500
    # Без лимита json-лог растёт бесконечно: панель пишет строку на каждый
    # запрос дашборда, а дашборд опрашивает сервер каждые несколько секунд.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    env_file:
      - .env
    volumes:
      - ./data:/opt/panel/data
      - ./awg_config:/etc/amnezia/amneziawg

  # Проба через настоящий туннель, см. docs/OPERATIONS.md. Без него панель
  # работает как раньше. Свой netns, из привилегий только NET_ADMIN.
  canary:
    image: vbif666/noisefloor-amneziawg-panel:latest
    container_name: NOISEFLOOR-canary
    restart: unless-stopped
    init: true
    entrypoint: ["python", "-m", "app.canary_probe"]
    command: []
    healthcheck:
      disable: true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./data/canary:/canary
